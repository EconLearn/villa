name: econlearn-check-win-torch-cu130
on:
  push:
    branches: [ci-win-torch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win-torch-cu130
      - uses: astral-sh/setup-uv@v10.3.3
      - name: uv lock (vesuvius)
        working-directory: vesuvius
        run: |
          uv --version
          uv lock
          git diff --stat
      - name: commit the lock to win-torch-cu130
        run: |
          git config user.name EconLearn
          git config user.email 268075294+EconLearn@users.noreply.github.com
          git add vesuvius/uv.lock
          git diff --cached --quiet && echo "lock unchanged" || git commit -m "vesuvius: uv lock for the Windows CUDA torch source"
          git push origin HEAD:win-torch-cu130
  check:
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win-torch-cu130
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: lock test from #2287
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider --noconftest vesuvius/tests/install/test_windows_torch_cuda_source.py
      - name: install the locked Windows torch wheel and check its build
        if: runner.os == 'Windows'
        shell: python
        run: |
          import tomllib, subprocess, sys
          lock = tomllib.load(open("vesuvius/uv.lock", "rb"))
          entry = [p for p in lock["package"] if p["name"] == "torch" and p["source"].get("registry", "").startswith("https://download.pytorch.org/whl/cu")]
          assert len(entry) == 1, [p["source"] for p in lock["package"] if p["name"] == "torch"]
          tag = "cp%d%d" % sys.version_info[:2]
          urls = [w["url"] for w in entry[0]["wheels"] if tag in w["url"] and w["url"].endswith("win_amd64.whl")]
          assert urls, entry[0]["wheels"]
          print("locked:", entry[0]["version"], urls[0])
          subprocess.run([sys.executable, "-m", "pip", "install", urls[0]], check=True)
          out = subprocess.run([sys.executable, "-c", "import torch; print(torch.__version__, torch.version.cuda, torch.backends.cuda.is_built())"], check=True, capture_output=True, text=True).stdout.strip()
          print("installed torch:", out)
          assert "+cu130" in out.split()[0] and out.split()[1].startswith("13"), out
